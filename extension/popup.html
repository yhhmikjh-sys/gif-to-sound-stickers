<!doctype html><html><head><meta charset="utf-8"><style>
body{width:290px;font-family:sans-serif;margin:0;padding:14px;color:#111}
h1{font-size:18px;margin:0 0 6px}p{font-size:13px;color:#444;margin:6px 0}
input{width:100%;box-sizing:border-box;padding:9px;border:2px solid #111;border-radius:12px;margin-top:6px}
button{width:100%;padding:10px;border:2px solid #111;border-radius:999px;background:#25D366;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
button.alt{background:#fff;color:#111}a{color:#111;font-size:12px;cursor:pointer;text-decoration:underline}
</style></head><body>
<h1>🔊 StikDesi Sender</h1>
<div id="out" hidden>
  <p>Sign in karo ya naya account banao. Website wala hi account chalega.</p>
  <input id="email" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+)">
  <button id="in">Sign in</button><button id="up" class="alt">Sign up</button>
</div>
<div id="inside" hidden>
  <p id="who"></p><p id="count">…</p>
  <button id="wa">Open WhatsApp Web</button>
  <p>WhatsApp Web mein chat kholo → neeche daayein 🔊 StikDesi → sticker par click → apne aap send.</p>
  <a id="out-btn">Sign out</a>
</div>
<p id="msg"></p>
<script src="api.js"></script><script src="popup.js"></script></body></html>
